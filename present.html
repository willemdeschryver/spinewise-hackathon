<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050810" />
    <title>Attune</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%236bdcc8'/%3E%3C/svg%3E" />
  </head>
  <body class="deck">
    <canvas id="stage" aria-hidden="true"></canvas>

    <header class="top" id="top">
      <div class="brand">Attune</div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="actions">
        <button class="ghost" id="btn-prev">Terug</button>
        <button class="ghost" id="btn-next">Volgende</button>
        <a class="ghost" href="./">Open de app</a>
      </div>
    </header>

    <div class="readings-all" id="readings"></div>

    <main class="slide" id="slide">
      <div class="slide-inner" id="slide-inner" aria-live="polite">
        <span class="tour-step" id="kicker"></span>
        <h1 id="title"></h1>
        <p id="text"></p>
        <ul class="slide-list" id="list" hidden></ul>
        <div class="start-actions" id="actions" hidden></div>
        <p class="hint" id="hint" hidden></p>
      </div>
    </main>

    <script type="module" src="/src/present.ts"></script>
  </body>
</html>
